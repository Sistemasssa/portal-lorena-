<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Homeopatia — Aula 09: Seminários Temáticos — Grau Técnico (Turma FMC09-M)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,600;0,700;1,600&family=Orbitron:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    :root {
      --grau-dark-green: #113818;
      --grau-bar-green: #346739;
      --grau-bright-green: #00B050;
      --grau-lime: #8BC53F;
      --grau-yellow: #FDB913;
      --hud-glow: rgba(0, 176, 80, 0.28);
    }

    * { box-sizing: border-box; user-select: none; }

    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background: radial-gradient(circle at 50% 20%, #132a19 0%, #07120a 100%);
      font-family: 'Plus Jakarta Sans', sans-serif; color: #1e293b;
    }

    #app-stage {
      position: relative; width: 100vw; height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden;
    }

    #slide-deck-viewport {
      position: relative; width: 1280px; height: 720px; background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(139, 197, 63, 0.35), 0 0 35px rgba(0, 176, 80, 0.2);
      overflow: hidden; display: flex; flex-direction: column; justify-content: space-between;
      transform-origin: center center; transition: box-shadow 0.4s ease;
    }

    .futuristic-bg-grid {
      position: absolute; inset: 0;
      background-image: linear-gradient(to right, rgba(17, 56, 24, 0.03) 1px, transparent 1px),
                        linear-gradient(to bottom, rgba(17, 56, 24, 0.03) 1px, transparent 1px);
      background-size: 36px 36px; pointer-events: none; z-index: 1;
    }

    .futuristic-corner-hud {
      position: absolute; top: 16px; right: 24px; z-index: 5;
      display: flex; align-items: center; gap: 10px; pointer-events: none;
    }

    #bio-particles {
      position: absolute; inset: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 2; opacity: 0.65;
    }

    #slide-stage-content {
      position: relative; z-index: 10; flex: 1; width: 100%; height: calc(100% - 52px);
      padding: 36px 58px 18px 58px; display: flex; flex-direction: column; overflow: hidden;
    }

    .slide-enter { animation: futuristicSlideIn 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

    @keyframes futuristicSlideIn {
      0% { opacity: 0; transform: translateY(18px) scale(0.985); filter: blur(4px); }
      100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }

    .stagger-item {
      opacity: 0; transform: translateY(16px);
      animation: staggerFadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes staggerFadeUp { to { opacity: 1; transform: translateY(0); } }

    .cover-title-text {
      font-family: 'Lora', Georgia, serif; font-weight: 700; color: #0d3b14;
      text-shadow: 2px 3px 6px rgba(0, 0, 0, 0.22), 0 0 25px rgba(0, 176, 80, 0.12);
      letter-spacing: -0.5px;
    }

    .slide-heading-serif { font-family: 'Lora', Georgia, serif; font-weight: 700; color: #0d3b14; }
    .font-hud { font-family: 'Orbitron', sans-serif; }

    .holo-card {
      position: relative; background: rgba(248, 251, 249, 0.88); backdrop-filter: blur(8px);
      border: 1px solid rgba(52, 103, 57, 0.18); border-radius: 14px;
      box-shadow: 0 8px 24px -6px rgba(17, 56, 24, 0.07), inset 0 1px 0 rgba(255, 255, 255, 0.9);
      transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1); overflow: hidden;
    }

    .holo-card::before {
      content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%;
      background: linear-gradient(180deg, #00B050, #346739); opacity: 0.85;
    }

    .holo-card.gold-accent::before { background: linear-gradient(180deg, #FDB913, #d97706); }
    .holo-card.red-accent::before { background: linear-gradient(180deg, #ef4444, #991b1b); }

    .holo-card:hover {
      transform: translateY(-4px); border-color: rgba(0, 176, 80, 0.55);
      box-shadow: 0 14px 30px -6px rgba(0, 176, 80, 0.16);
    }

    .scan-box { position: relative; overflow: hidden; }
    .scan-box::after {
      content: ''; position: absolute; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, transparent, rgba(0, 176, 80, 0.6), rgba(253, 185, 19, 0.8), rgba(0, 176, 80, 0.6), transparent);
      box-shadow: 0 0 12px rgba(0, 176, 80, 0.6); animation: verticalScan 4.5s ease-in-out infinite; pointer-events: none;
    }

    @keyframes verticalScan { 0%, 100% { top: 2%; opacity: 0.2; } 50% { top: 96%; opacity: 0.85; } }

    .grau-template-footer {
      position: relative; z-index: 20; width: 100%; height: 52px; background: #ffffff;
      display: flex; align-items: flex-end; justify-content: space-between; flex-shrink: 0; padding: 0;
    }

    .footer-bars-track { display: flex; align-items: flex-end; width: 82.5%; height: 36px; }
    .f-seg-1 { width: 7.5%; height: 100%; background-color: #346739; }
    .f-seg-2 { width: 31.5%; height: 100%; background-color: #FDB913; }
    .f-gap-1 { width: 4.2%; height: 100%; background-color: #ffffff; }
    .f-seg-3 { width: 17.0%; height: 100%; background-color: #00B050; }
    .f-seg-4 { width: 24.3%; height: 100%; background-color: #346739; }
    .f-gap-2 { width: 4.5%; height: 100%; background-color: #ffffff; }
    .f-seg-5 { width: 15.5%; height: 100%; background-color: #FDB913; }

    .footer-logo-zone {
      width: 17.5%; height: 52px; background: #ffffff;
      display: flex; align-items: center; justify-content: center; padding-right: 12px; padding-bottom: 2px;
    }

    .futuristic-table {
      width: 100%; border-collapse: separate; border-spacing: 0; border-radius: 12px;
      overflow: hidden; border: 1px solid rgba(52, 103, 57, 0.2); box-shadow: 0 6px 20px rgba(17, 56, 24, 0.05);
    }
    .futuristic-table th {
      background: linear-gradient(90deg, #113818 0%, #24582c 100%); color: #ffffff;
      font-weight: 700; text-align: left; padding: 12px 16px; font-size: 15px; letter-spacing: 0.3px;
    }
    .futuristic-table td {
      padding: 11px 16px; font-size: 14.5px; border-bottom: 1px solid #e2e8f0;
      background: #ffffff; color: #1e293b; transition: background 0.2s;
    }
    .futuristic-table tr:nth-child(even) td { background: #f4f9f5; }
    .futuristic-table tr:hover td { background: #e6f4ea; }

    #laser-dot {
      position: fixed; width: 14px; height: 14px; border-radius: 50%; background: #00ff66;
      box-shadow: 0 0 12px 4px #00ff66, 0 0 24px 8px #00B050; pointer-events: none;
      z-index: 9999; transform: translate(-50%, -50%); display: none;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f2415; }
    ::-webkit-scrollbar-thumb { background: #00B050; border-radius: 3px; }
  </style>
</head>
<body>

  <div id="laser-dot"></div>

  <svg width="0" height="0" style="position:absolute">
    <defs>
      <g id="grau-tecnico-logo">
        <text x="4" y="34" font-family="'Plus Jakarta Sans', 'Arial Rounded MT Bold', sans-serif" font-weight="800" font-size="37" letter-spacing="-2.2" fill="#0a0a0a">grau</text>
        <circle cx="93" cy="12" r="10.5" fill="#ffffff" />
        <circle cx="93" cy="12" r="8.2" fill="#ffffff" stroke="#8BC53F" stroke-width="2.6" />
        <text x="93" y="16.2" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11.5" fill="#0a0a0a">T</text>
        <text x="89" y="45" text-anchor="end" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="9.5" letter-spacing="1.4" fill="#8BC53F">TÉCNICO</text>
      </g>
    </defs>
  </svg>

  <div id="app-stage">

      <div class="hidden md:flex flex-col items-center flex-1 max-w-xs mx-4">

        </div>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="prevSlide()" title="Slide Anterior" class="w-8 h-8 rounded-full bg-slate-800/90 hover:bg-emerald-600 text-white flex items-center justify-center transition">
          <i class="fa-solid fa-chevron-left text-xs"></i>
        </button>
        <div class="px-3 py-1 rounded-full bg-slate-900 border border-emerald-500/40 font-hud text-xs font-bold text-emerald-300 min-w-[78px] text-center" id="hud-counter">
          01 / 15
        </div>
        <button onclick="nextSlide()" title="Próximo Slide" class="w-8 h-8 rounded-full bg-slate-800/90 hover:bg-emerald-600 text-white flex items-center justify-center transition">
          <i class="fa-solid fa-chevron-right text-xs"></i>
        </button>
        <div class="h-4 w-[1px] bg-slate-700 mx-1"></div>
        <button onclick="toggleDrawer()" title="Mapa dos 15 Slides (Tecla G)" class="px-3 py-1.5 rounded-full bg-emerald-600/20 hover:bg-emerald-600/40 border border-emerald-500/40 text-emerald-300 text-xs font-semibold flex items-center gap-1.5 transition">
          <i class="fa-solid fa-table-cells-large"></i>
          <span class="hidden sm:inline">15 Slides</span>
        </button>
        <button onclick="toggleLaser()" id="btn-laser" title="Apontador Laser (Tecla L)" class="w-8 h-8 rounded-full bg-slate-800/90 hover:bg-emerald-600 text-slate-300 flex items-center justify-center transition">
          <i class="fa-solid fa-wand-magic-sparkles text-xs"></i>
        </button>
        <button onclick="toggleFullScreen()" title="Tela Cheia (Tecla F)" class="w-8 h-8 rounded-full bg-slate-800/90 hover:bg-emerald-600 text-slate-300 flex items-center justify-center transition">
          <i class="fa-solid fa-expand text-xs"></i>
        </button>
      </div>
    </header>

    <main id="slide-deck-viewport">
      <div class="futuristic-bg-grid"></div>
      <canvas id="bio-particles"></canvas>

      <div class="futuristic-corner-hud" id="slide-telemetry">
        <span class="px-2.5 py-0.5 rounded-full text-[11px] font-hud font-bold tracking-wider bg-emerald-950/10 text-emerald-800 border border-emerald-700/20" id="internal-slide-num">SLIDE 01 // 15</span>
      </div>

      <div id="slide-stage-content" class="slide-enter"></div>

      <footer class="grau-template-footer">
        <div class="footer-bars-track">
          <div class="f-seg-1"></div>
          <div class="f-seg-2"></div>
          <div class="f-gap-1"></div>
          <div class="f-seg-3"></div>
          <div class="f-seg-4"></div>
          <div class="f-gap-2"></div>
          <div class="f-seg-5"></div>
        </div>
        <div class="footer-logo-zone">
          <svg viewBox="0 0 112 48" class="w-32 h-12 overflow-visible">
            <use href="#grau-tecnico-logo"></use>
          </svg>
        </div>
      </footer>
    </main>

    <div id="slide-drawer" class="fixed inset-0 z-50 bg-neutral-950/90 backdrop-blur-xl hidden flex-col p-6 md:p-10">
      <div class="flex items-center justify-between max-w-7xl w-full mx-auto mb-6 pb-4 border-b border-emerald-500/30">
        <div class="flex items-center gap-3">
          <i class="fa-solid fa-layer-group text-2xl text-emerald-400"></i>
          <div>
            <h2 class="text-xl font-bold text-white font-hud">ÍNDICE INTERATIVO — AULA 09 (15 SLIDES)</h2>
            <p class="text-xs text-slate-400">Seminários Temáticos e Avaliação em Grupo • Turma FMC09-M</p>
          </div>
        </div>
        <button onclick="toggleDrawer()" class="px-4 py-2 rounded-lg bg-slate-800 hover:bg-rose-600 text-white text-sm font-semibold flex items-center gap-2 transition">
          <i class="fa-solid fa-xmark"></i> Fechar (ESC)
        </button>
      </div>
      <div id="drawer-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 max-w-7xl w-full mx-auto overflow-y-auto pr-2"></div>
    </div>
  </div>

      else if (slide.type === "process-kpis") {
        html = `

                    <span>AVALIAÇÃO DOCENTE</span>
                    <i class="fa-solid fa-circle-arrow-right text-emerald-600"></i>

            <div class="grid grid-cols-3 gap-5 mt-4">
              ${slide.kpis.map((k, i) => `

      else if (slide.type === "split-columns") {
        html = `

                  <div>

              `).join("")}
            </div>

            <div class="col-span-7 holo-card gold-accent p-6 h-[430px] flex flex-col justify-between bg-gradient-to-br from-white to-emerald-50/40">
              <div>
                <div class="flex items-center justify-between mb-3">
                  <span class="px-3 py-1 rounded-full bg-[#113818] text-amber-400 font-hud text-xs font-bold">${g.id}</span>

                </div>
                <h3 class="text-xl font-extrabold text-[#113818] mb-2">${g.title}</h3>

      else if (slide.type === "interactive-cases") {

        html = `

              <div>
                <span class="text-xs font-hud font-bold text-amber-400">SÍNTESE DOS SEMINÁRIOS</span>
                <h3 class="text-2xl font-bold font-serif mt-1 mb-3">Tríades Clínicas</h3>
                <ul class="space-y-3 text-sm text-emerald-50">
                  <li><i class="fa-solid fa-circle-check text-amber-400 mr-2"></i><b>Febres:</b> Aconitum (seco/susto), Belladonna (rubor/suor), Gelsemium (torpor).</li>
                  <li><i class="fa-solid fa-circle-check text-amber-400 mr-2"></i><b>Traumas:</b> Arnica (músculo), Hypericum (nervo), Ruta (tendão), Symphytum (osso).</li>
                  <li><i class="fa-solid fa-circle-check text-amber-400 mr-2"></i><b>Digestivos:</b> Nux vomica, Lycopodium (16h–20h) e Pulsatilla.</li>
                </ul>
              </div>
              <div class="p-3 rounded-xl bg-black/25 border border-white/10 text-xs text-emerald-200">
                <b>Próxima Aula (Aula 10):</b> Medicamentos Homeopáticos X Medicamentos Não-Homeopáticos.
              </div>
            </div>

            <div class="col-span-8 holo-card gold-accent p-6 flex flex-col justify-between">
              <div>
                <div class="flex items-center justify-between mb-4">
                  <span class="px-3 py-1 rounded-full bg-[#113818] text-amber-400 font-hud text-xs font-bold">${c.badge}</span>
                  <div class="flex gap-2">
                    ${aula09Cases.map((_, idx) => `
                      <button onclick="selectCase(${idx})" class="px-3 py-1 rounded-lg text-xs font-bold transition ${idx === activeCaseIdx ? 'bg-emerald-600 text-white shadow' : 'bg-slate-200 text-slate-700 hover:bg-slate-300'}">
                        Arguição 0${idx + 1}
                      </button>
                    `).join("")}
                  </div>
                </div>
                <div class="p-3.5 rounded-xl bg-white border border-slate-200 mb-3">
                  <p class="text-xs font-hud text-slate-400 uppercase">Caso Apresentado à Equipe</p>
                  <p class="text-[15px] font-semibold text-slate-800 mt-0.5">${c.patient}</p>
                </div>
                <div class="p-3.5 rounded-xl bg-emerald-950/5 border border-emerald-900/20 mb-4">
                  <p class="text-xs font-hud text-emerald-800 uppercase">Referência Técnica</p>
                  <p class="text-[14.5px] text-slate-800 mt-0.5">${c.lab}</p>
                </div>
                <p class="text-base font-bold text-[#113818] mb-3"><i class="fa-solid fa-circle-question text-amber-500 mr-1.5"></i>${c.question}</p>
              </div>
              <div>
                ${caseRevealed ? `
                  <div class="p-4 rounded-xl bg-[#113818] text-white text-sm leading-relaxed">
                    <span class="text-amber-400 font-bold block mb-1"><i class="fa-solid fa-check-double mr-1"></i>RESPOSTA OFICIAL DA BANCA:</span>
                    ${c.answer}
                  </div>
                ` : `
                  <button onclick="revealCaseAnswer()" class="w-full py-3 rounded-xl bg-gradient-to-r from-[#113818] to-[#00B050] hover:opacity-95 text-white font-bold text-sm shadow-lg flex items-center justify-center gap-2 transition">
                    <i class="fa-solid fa-eye"></i> Revelar Resposta Oficial da Banca
                  </button>
                `}
              </div>
            </div>
          </div>
        `;
      }

      container.innerHTML = html;
    }

    function renderSlideHeader(slide) {
      return `
        <div class="mb-4 pb-2 border-b border-emerald-900/10 flex items-end justify-between stagger-item" style="animation-delay: 0.04s">
          <div>
            <div class="flex items-center gap-2 mb-1">
              <span class="w-2 h-2 rounded-full bg-[#00B050]"></span>
              <p class="text-xs font-hud font-bold tracking-wider text-[#00B050] uppercase">${slide.eyebrow}</p>
            </div>
            <h2 class="slide-heading-serif text-[31px] leading-tight">${slide.title}</h2>
          </div>
        </div>
      `;
    }

    function renderVisualDiagram(type) {
      if (type === "svg-seminar-synthesis") {
        return `
          <svg viewBox="0 0 280 310" class="w-full h-full">
            <text x="140" y="22" font-size="11" font-weight="bold" fill="#113818" text-anchor="middle">INTEGRAÇÃO TEÓRICO-PRÁTICA</text>
            <circle cx="140" cy="150" r="38" fill="#113818" stroke="#FDB913" stroke-width="3"/>
            <text x="140" y="146" font-size="9.5" font-weight="bold" fill="#FDB913" text-anchor="middle">TÉCNICO EM</text>
            <text x="140" y="160" font-size="9.5" font-weight="bold" fill="#ffffff" text-anchor="middle">FARMÁCIA</text>

            <rect x="75" y="38" width="130" height="32" rx="8" fill="#00B050"/>
            <text x="140" y="58" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">1. Doutrina & FHB 3ª Ed.</text>

            <rect x="75" y="232" width="130" height="32" rx="8" fill="#346739"/>
            <text x="140" y="252" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">2. BPMH (RDC 67/2007)</text>

            <rect x="6" y="134" width="84" height="32" rx="8" fill="#FDB913"/>
            <text x="48" y="154" font-size="9.5" font-weight="bold" fill="#113818" text-anchor="middle">3. Bancada</text>

            <rect x="190" y="134" width="84" height="32" rx="8" fill="#FDB913"/>
            <text x="232" y="154" font-size="9.5" font-weight="bold" fill="#113818" text-anchor="middle">4. Dispensação</text>

            <text x="140" y="292" font-size="10" font-weight="bold" fill="#113818" text-anchor="middle">Preparação para as Aulas Práticas de Laboratório</text>
          </svg>
        `;
      }
      return "";
    }

    function selectGroup(idx) { activeGroupIdx = idx; renderSlide(currentSlideIndex); }
    function selectCase(idx) { activeCaseIdx = idx; caseRevealed = false; renderSlide(currentSlideIndex); }
    function revealCaseAnswer() { caseRevealed = true; renderSlide(currentSlideIndex); }
    function nextSlide() { if (currentSlideIndex < slidesData.length - 1) { currentSlideIndex++; renderSlide(currentSlideIndex); } }
    function prevSlide() { if (currentSlideIndex > 0) { currentSlideIndex--; renderSlide(currentSlideIndex); } }

    function goToSlide(idx) {
      currentSlideIndex = idx;
      renderSlide(currentSlideIndex);
      const drawer = document.getElementById("slide-drawer");
      if (!drawer.classList.contains("hidden")) toggleDrawer();
    }

    function toggleDrawer() {
      const drawer = document.getElementById("slide-drawer");
      if (drawer.classList.contains("hidden")) {
        populateDrawer();
        drawer.classList.remove("hidden");
        drawer.classList.add("flex");
      } else {
        drawer.classList.add("hidden");
        drawer.classList.remove("flex");
      }
    }

    function populateDrawer() {
      const grid = document.getElementById("drawer-grid");
      grid.innerHTML = slidesData.map((s, idx) => `
        <button onclick="goToSlide(${idx})" class="text-left p-3.5 rounded-xl border transition-all flex flex-col justify-between ${idx === currentSlideIndex ? 'bg-emerald-900/60 border-emerald-400 ring-2 ring-emerald-400/40' : 'bg-slate-900/80 border-slate-800 hover:border-emerald-500/50 hover:bg-slate-800/70'}">
          <div>
            <div class="flex items-center justify-between mb-1">
              <span class="font-hud text-xs font-bold ${idx === currentSlideIndex ? 'text-amber-400' : 'text-emerald-400'}">SLIDE ${String(s.id).padStart(2, '0')}</span>
              <span class="text-[10px] text-slate-400 truncate max-w-[140px]">${s.module}</span>
            </div>
            <p class="text-sm font-bold text-white line-clamp-2 leading-snug">${s.title}</p>
          </div>
        </button>
      `).join("");
    }

    function toggleLaser() {
      laserEnabled = !laserEnabled;
      const dot = document.getElementById("laser-dot");
      const btn = document.getElementById("btn-laser");
      dot.style.display = laserEnabled ? "block" : "none";
      btn.classList.toggle("bg-emerald-600", laserEnabled);
      btn.classList.toggle("text-white", laserEnabled);
    }

    window.addEventListener("mousemove", (e) => {
      if (laserEnabled) {
        const dot = document.getElementById("laser-dot");
        dot.style.left = `${e.clientX}px`;
        dot.style.top = `${e.clientY}px`;
      }
    });

    function toggleFullScreen() {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
      else document.exitFullscreen().catch(() => {});
    }

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") { e.preventDefault(); nextSlide(); }
      else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); prevSlide(); }
      else if (e.key === "Home") goToSlide(0);
      else if (e.key === "End") goToSlide(slidesData.length - 1);
      else if (e.key.toLowerCase() === "g") toggleDrawer();
      else if (e.key.toLowerCase() === "l") toggleLaser();
      else if (e.key.toLowerCase() === "f") toggleFullScreen();
      else if (e.key === "Escape") {
        const drawer = document.getElementById("slide-drawer");
        if (!drawer.classList.contains("hidden")) toggleDrawer();
      }
    });

    function fitSlideViewport() {
      const viewport = document.getElementById("slide-deck-viewport");
      const availableW = window.innerWidth - 36;
      const availableH = window.innerHeight - 84;
      const scale = Math.min(availableW / 1280, availableH / 720, 1.15);
      viewport.style.transform = `scale(${scale})`;
    }

    window.addEventListener("resize", fitSlideViewport);

    function initBioParticles() {
      const canvas = document.getElementById("bio-particles");
      const ctx = canvas.getContext("2d");
      canvas.width = 1280; canvas.height = 720;
      const particles = Array.from({ length: 28 }, (_, i) => ({
        x: Math.random() * canvas.width, y: Math.random() * canvas.height,
        r: Math.random() * 4 + 2, vx: (Math.random() - 0.5) * 0.45, vy: (Math.random() - 0.5) * 0.45,
        color: i % 3 === 0 ? "rgba(253, 185, 19, 0.22)" : "rgba(0, 176, 80, 0.16)"
      }));

      function animateParticles() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];
          p.x += p.vx; p.y += p.vy;
          if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
          if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fillStyle = p.color; ctx.fill();
          for (let j = i + 1; j < particles.length; j++) {
            const p2 = particles[j];
            const dist = Math.hypot(p.x - p2.x, p.y - p2.y);
            if (dist < 130) {
              ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p2.x, p2.y);
              ctx.strokeStyle = `rgba(52, 103, 57, ${0.07 * (1 - dist / 130)})`; ctx.lineWidth = 1; ctx.stroke();
            }
          }
        }
        requestAnimationFrame(animateParticles);
      }
      animateParticles();
    }

    window.onload = function () {
      fitSlideViewport();
      initBioParticles();
      renderSlide(0);
    };
  </script>
