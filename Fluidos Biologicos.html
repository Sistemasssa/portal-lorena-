<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Urinálise e Fluídos Biológicos — Grau Técnico (Turma ANC06-N)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,600;0,700;1,600&family=Orbitron:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    :root {
      --grau-dark-green: #113818;
      --grau-bar-green: #346739;
      --grau-bright-green: #00B050;
      --grau-lime: #8BC53F;
      --grau-yellow: #FDB913;
      --hud-glow: rgba(0, 176, 80, 0.28);
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 20%, #132a19 0%, #07120a 100%);
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #1e293b;
    }

    /* Futuristic Stage Wrapper */
    #app-stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
       flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* 16:9 Slide Viewport with Responsive Scaling */
    #slide-deck-viewport {
      position: relative;
      width: 1280px;
      height: 720px;
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(139, 197, 63, 0.35), 0 0 35px rgba(0, 176, 80, 0.2);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transform-origin: center center;
      transition: box-shadow 0.4s ease;
    }

    /* Subtle Futuristic Bio-Grid Overlay inside White Template */
    .futuristic-bg-grid {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(17, 56, 24, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(17, 56, 24, 0.03) 1px, transparent 1px);
      background-size: 36px 36px;
      pointer-events: none;
      z-index: 1;
    }

    .futuristic-corner-hud {
      position: absolute;
      top: 16px;
      right: 24px;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: none;
    }

    /* Particle Canvas inside slide */
    #bio-particles {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
      opacity: 0.65;
    }

    /* Slide Content Layer */
    #slide-stage-content {
      position: relative;
      z-index: 10;
      flex: 1;
      width: 100%;
      height: calc(100% - 52px);
      padding: 36px 58px 18px 58px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Slide Animations */
    .slide-enter {
      animation: futuristicSlideIn 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes futuristicSlideIn {
      0% {
        opacity: 0;
        transform: translateY(18px) scale(0.985);
        filter: blur(4px);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    .stagger-item {
      opacity: 0;
      transform: translateY(16px);
      animation: staggerFadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes staggerFadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Cover Title Exact Style with Futuristic Polish */
    .cover-title-text {
      font-family: 'Lora', Georgia, serif;
      font-weight: 700;
      color: #0d3b14;
      text-shadow: 2px 3px 6px rgba(0, 0, 0, 0.22), 0 0 25px rgba(0, 176, 80, 0.12);
      letter-spacing: -0.5px;
    }

    .slide-heading-serif {
      font-family: 'Lora', Georgia, serif;
      font-weight: 700;
      color: #0d3b14;
    }

    .font-hud {
      font-family: 'Orbitron', sans-serif;
    }

    /* Futuristic Cards on Clean White Template */
    .holo-card {
      position: relative;
      background: rgba(248, 251, 249, 0.88);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(52, 103, 57, 0.18);
      border-radius: 14px;
      box-shadow: 0 8px 24px -6px rgba(17, 56, 24, 0.07), inset 0 1px 0 rgba(255, 255, 255, 0.9);
      transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      overflow: hidden;
    }

    .holo-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: linear-gradient(180deg, #00B050, #346739);
      opacity: 0.85;
    }

    .holo-card.gold-accent::before {
      background: linear-gradient(180deg, #FDB913, #d97706);
    }

    .holo-card.red-accent::before {
      background: linear-gradient(180deg, #ef4444, #991b1b);
    }

    .holo-card:hover {
      transform: translateY(-4px);
      border-color: rgba(0, 176, 80, 0.55);
      box-shadow: 0 14px 30px -6px rgba(0, 176, 80, 0.16);
    }

    /* Futuristic Scanline Effect on Diagrams */
    .scan-box {
      position: relative;
      overflow: hidden;
    }
    .scan-box::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, rgba(0, 176, 80, 0.6), rgba(253, 185, 19, 0.8), rgba(0, 176, 80, 0.6), transparent);
      box-shadow: 0 0 12px rgba(0, 176, 80, 0.6);
      animation: verticalScan 4.5s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes verticalScan {
      0%, 100% { top: 2%; opacity: 0.2; }
      50% { top: 96%; opacity: 0.85; }
    }

    /* EXACT GRAU TÉCNICO TEMPLATE FOOTER BAR */
    .grau-template-footer {
      position: relative;
      z-index: 20;
      width: 100%;
      height: 52px;
      background: #ffffff;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      flex-shrink: 0;
      padding: 0;
    }

    .footer-bars-track {
      display: flex;
      align-items: flex-end;
      width: 82.5%;
      height: 36px;
    }

    .f-seg-1 { width: 7.5%; height: 100%; background-color: #346739; }
    .f-seg-2 { width: 31.5%; height: 100%; background-color: #FDB913; }
    .f-gap-1 { width: 4.2%; height: 100%; background-color: #ffffff; }
    .f-seg-3 { width: 17.0%; height: 100%; background-color: #00B050; }
    .f-seg-4 { width: 24.3%; height: 100%; background-color: #346739; }
    .f-gap-2 { width: 4.5%; height: 100%; background-color: #ffffff; }
    .f-seg-5 { width: 15.5%; height: 100%; background-color: #FDB913; }

    .footer-logo-zone {
      width: 17.5%;
      height: 52px;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-right: 12px;
      padding-bottom: 2px;
    }

    /* Custom Table Styling */
    .futuristic-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(52, 103, 57, 0.2);
      box-shadow: 0 6px 20px rgba(17, 56, 24, 0.05);
    }
    .futuristic-table th {
      background: linear-gradient(90deg, #113818 0%, #24582c 100%);
      color: #ffffff;
      font-weight: 700;
      text-align: left;
      padding: 13px 18px;
      font-size: 16px;
      letter-spacing: 0.3px;
    }
    .futuristic-table td {
      padding: 12px 18px;
      font-size: 16px;
      border-bottom: 1px solid #e2e8f0;
      background: #ffffff;
      color: #1e293b;
      transition: background 0.2s;
    }
    .futuristic-table tr:nth-child(even) td {
      background: #f4f9f5;
    }
    .futuristic-table tr:hover td {
      background: #e6f4ea;
    }

    /* Laser Pointer Trail */
    #laser-dot {
      position: fixed;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #00ff66;
      box-shadow: 0 0 12px 4px #00ff66, 0 0 24px 8px #00B050;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      display: none;
    }

    /* Scrollbar for Slide Drawer */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f2415; }
    ::-webkit-scrollbar-thumb { background: #00B050; border-radius: 3px; }
  </style>
</head>
<body>

  <!-- Laser Pointer Dot -->
  <div id="laser-dot"></div>

  <!-- Reusable SVG Defs (Exact Grau Técnico Logo) -->
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <g id="grau-tecnico-logo">
        <!-- "grau" bold geometric rounded black letters -->
        <text x="4" y="34" font-family="'Plus Jakarta Sans', 'Arial Rounded MT Bold', sans-serif" font-weight="800" font-size="37" letter-spacing="-2.2" fill="#0a0a0a">grau</text>
        <!-- White halo + Lime Green Ring + Black T at top right of 'u' -->
        <circle cx="93" cy="12" r="10.5" fill="#ffffff" />
        <circle cx="93" cy="12" r="8.2" fill="#ffffff" stroke="#8BC53F" stroke-width="2.6" />
        <text x="93" y="16.2" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11.5" fill="#0a0a0a">T</text>
        <!-- "TÉCNICO" in lime green underneath 'au' -->
        <text x="89" y="45" text-anchor="end" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="9.5" letter-spacing="1.4" fill="#8BC53F">TÉCNICO</text>
      </g>
    </defs>
  </svg>

  <!-- Main Stage -->
  <div id="app-stage">

    <!-- Top Futuristic Floating Control HUD -->
    <header class="fixed top-3 z-40 flex items-center justify-between gap-4 px-5 py-2 rounded-full bg-neutral-950/85 backdrop-blur-md border border-emerald-500/30 text-white shadow-2xl transition-all duration-300" style="width: min(1240px, 95vw);">
      <div class="flex items-center gap-3">
        <span class="inline-flex items-center justify-center w-8 h-8 rounded-full bg-emerald-500/20 border border-emerald-400/40 text-emerald-400">
          <i class="fa-solid fa-microscope text-sm"></i>
        </span>
        <div>
          <div class="flex items-center gap-2">
            <span class="text-xs font-hud uppercase tracking-wider text-emerald-400" id="hud-module-badge">MÓDULO 01</span>
            <span class="text-xs text-slate-400">|</span>
            <span class="text-xs font-semibold text-amber-400">TURMA ANC06-N</span>
          </div>
          <p class="text-xs text-slate-300 truncate max-w-[280px] sm:max-w-[420px]" id="hud-slide-title">Capa — Urinálise e Fluídos Biológicos</p>
        </div>
      </div>

      <!-- Progress bar in center -->
      <div class="hidden md:flex flex-col items-center flex-1 max-w-xs mx-4">
        <div class="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden border border-slate-700">
          <div id="hud-progress-bar" class="h-full bg-gradient-to-r from-emerald-500 via-lime-400 to-amber-400 transition-all duration-300" style="width: 2.5%;"></div>
        </div>
      </div>

      <!-- Controls -->
      <div class="flex items-center gap-2">
        <button onclick="prevSlide()" title="Slide Anterior (Seta Esquerda)" class="w-8 h-8 rounded-full bg-slate-800/90 hover:bg-emerald-600 text-white flex items-center justify-center transition">
          <i class="fa-solid fa-chevron-left text-xs"></i>
        </button>

        <div class="px-3 py-1 rounded-full bg-slate-900 border border-emerald-500/40 font-hud text-xs font-bold text-emerald-300 min-w-[78px] text-center" id="hud-counter">
          01 / 40
        </div>

        <button onclick="nextSlide()" title="Próximo Slide (Seta Direita / Espaço)" class="w-8 h-8 rounded-full bg-slate-800/90 hover:bg-emerald-600 text-white flex items-center justify-center transition">
          <i class="fa-solid fa-chevron-right text-xs"></i>
        </button>

        <div class="h-4 w-[1px] bg-slate-700 mx-1"></div>

        <button onclick="toggleDrawer()" title="Mapa de Todos os 40 Slides (Tecla G)" class="px-3 py-1.5 rounded-full bg-emerald-600/20 hover:bg-emerald-600/40 border border-emerald-500/40 text-emerald-300 text-xs font-semibold flex items-center gap-1.5 transition">
          <i class="fa-solid fa-table-cells-large"></i>
          <span class="hidden sm:inline">40 Slides</span>
        </button>

        <button onclick="toggleLaser()" id="btn-laser" title="Apontador Laser de Aula (Tecla L)" class="w-8 h-8 rounded-full bg-slate-800/90 hover:bg-emerald-600 text-slate-300 flex items-center justify-center transition">
          <i class="fa-solid fa-wand-magic-sparkles text-xs"></i>
        </button>

        <button onclick="toggleFullScreen()" title="Tela Cheia (Tecla F)" class="w-8 h-8 rounded-full bg-slate-800/90 hover:bg-emerald-600 text-slate-300 flex items-center justify-center transition">
          <i class="fa-solid fa-expand text-xs"></i>
        </button>
      </div>
    </header>

    <!-- 16:9 Slide Deck Container -->
    <main id="slide-deck-viewport">
      <!-- Subtle Hex/Grid & Animated Bio-Particles -->
      <div class="futuristic-bg-grid"></div>
      <canvas id="bio-particles"></canvas>

      <!-- Top-right subtle HUD telemetry inside slide -->
      <div class="futuristic-corner-hud" id="slide-telemetry">
        <span class="px-2.5 py-0.5 rounded-full text-[11px] font-hud font-bold tracking-wider bg-emerald-950/10 text-emerald-800 border border-emerald-700/20" id="internal-slide-num">SLIDE 01 // 40</span>
      </div>

      <!-- Dynamic Slide Content Target -->
      <div id="slide-stage-content" class="slide-enter">
        <!-- Rendered by JS -->
      </div>

      <!-- MANDATORY EXACT TEMPLATE FOOTER ON EVERY SLIDE -->
      <footer class="grau-template-footer">
        <div class="footer-bars-track">
          <div class="f-seg-1"></div>
          <div class="f-seg-2"></div>
          <div class="f-gap-1"></div>
          <div class="f-seg-3"></div>
          <div class="f-seg-4"></div>
          <div class="f-gap-2"></div>
          <div class="f-seg-5"></div>
        </div>
        <div class="footer-logo-zone">
          <svg viewBox="0 0 112 48" class="w-32 h-12 overflow-visible">
            <use href="#grau-tecnico-logo"></use>
          </svg>
        </div>
      </footer>
    </main>

    <!-- Slide Overview Drawer Modal (Jump to any of the 40 slides) -->
    <div id="slide-drawer" class="fixed inset-0 z-50 bg-neutral-950/90 backdrop-blur-xl hidden flex-col p-6 md:p-10">
      <div class="flex items-center justify-between max-w-7xl w-full mx-auto mb-6 pb-4 border-b border-emerald-500/30">
        <div class="flex items-center gap-3">
          <i class="fa-solid fa-layer-group text-2xl text-emerald-400"></i>
          <div>
            <h2 class="text-xl font-bold text-white font-hud">ÍNDICE INTERATIVO — 40 SLIDES</h2>
            <p class="text-xs text-slate-400">Clique em qualquer slide para navegar diretamente • Turma ANC06-N</p>
          </div>
        </div>
        <button onclick="toggleDrawer()" class="px-4 py-2 rounded-lg bg-slate-800 hover:bg-rose-600 text-white text-sm font-semibold flex items-center gap-2 transition">
          <i class="fa-solid fa-xmark"></i> Fechar (ESC)
        </button>
      </div>
      <div id="drawer-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 max-w-7xl w-full mx-auto overflow-y-auto pr-2">
        <!-- Populated dynamically -->
      </div>
    </div>

  </div>

      if (type === "svg-casts-formation") {

            <!-- Hyaline Cast -->
            <rect x="35" y="45" width="210" height="44" rx="22" fill="#f1f5f9" stroke="#64748b" stroke-width="2" stroke-dasharray="5,3"/>
            <text x="140" y="72" font-size="12" font-weight="bold" fill="#475569" text-anchor="middle">Cilindro Hialino (Transparente)</text>

            <circle cx="140" cy="139" r="11" fill="#dc2626"/><circle cx="175" cy="139" r="11" fill="#dc2626"/>
            <text x="140" y="180" font-size="11" font-weight="bold" fill="#991b1b" text-anchor="middle">Cilindro Hemático (Glomerulonefrite)</text>
            <!-- Waxy Cast -->
            <rect x="35" y="205" width="210" height="52" rx="8" fill="#fef08a" stroke="#b45309" stroke-width="3"/>

      if (type === "svg-acid-crystals") {
        return `
          <svg viewBox="0 0 280 300" class="w-full h-full">

            <!-- Calcium Oxalate Dihydrate (Envelope) -->
            <rect x="45" y="55" width="75" height="75" fill="#e2e8f0" stroke="#113818" stroke-width="2.5"/>

      if (type === "svg-alkaline-crystals") {
        return `
          <svg viewBox="0 0 280 300" class="w-full h-full">
            <text x="140" y="24" font-size="11" font-weight="bold" fill="#113818" text-anchor="middle">CRISTAIS DE URINA ALCALINA</text>

    /* ==========================================================================
       INTERACTIVE HANDLERS & NAVIGATION CONTROLS
       ========================================================================== */
    function selectUrineColor(idx) {
      activeUrineColorIdx = idx;
      renderSlide(currentSlideIndex);
    }

    function selectDipstickPad(idx) {
      activeDipstickIdx = idx;
      renderSlide(currentSlideIndex);
    }

    function setCsfMode(mode) {
      activeCsfMode = mode;
      renderSlide(currentSlideIndex);
    }

    function selectCase(idx) {
      activeCaseIdx = idx;
      caseRevealed = false;
      renderSlide(currentSlideIndex);
    }

    function revealCaseAnswer() {
      caseRevealed = true;
      renderSlide(currentSlideIndex);
    }

    function nextSlide() {
      if (currentSlideIndex < slidesData.length - 1) {
        currentSlideIndex++;
        renderSlide(currentSlideIndex);
      }
    }

    function prevSlide() {
      if (currentSlideIndex > 0) {
        currentSlideIndex--;
        renderSlide(currentSlideIndex);
      }
    }

    function goToSlide(idx) {
      currentSlideIndex = idx;
      renderSlide(currentSlideIndex);
      const drawer = document.getElementById("slide-drawer");
      if (!drawer.classList.contains("hidden")) {
        toggleDrawer();
      }
    }

    function toggleDrawer() {
      const drawer = document.getElementById("slide-drawer");
      if (drawer.classList.contains("hidden")) {
        populateDrawer();
        drawer.classList.remove("hidden");
        drawer.classList.add("flex");
      } else {
        drawer.classList.add("hidden");
        drawer.classList.remove("flex");
      }
    }

    function populateDrawer() {
      const grid = document.getElementById("drawer-grid");
      grid.innerHTML = slidesData.map((s, idx) => `
        <button onclick="goToSlide(${idx})" class="text-left p-3.5 rounded-xl border transition-all flex flex-col justify-between ${idx === currentSlideIndex ? 'bg-emerald-900/60 border-emerald-400 ring-2 ring-emerald-400/40' : 'bg-slate-900/80 border-slate-800 hover:border-emerald-500/50 hover:bg-slate-800/70'}">
          <div>
            <div class="flex items-center justify-between mb-1">
              <span class="font-hud text-xs font-bold ${idx === currentSlideIndex ? 'text-amber-400' : 'text-emerald-400'}">SLIDE ${String(s.id).padStart(2, '0')}</span>
              <span class="text-[10px] text-slate-400 truncate max-w-[140px]">${s.module}</span>
            </div>
            <p class="text-sm font-bold text-white line-clamp-2 leading-snug">${s.title}</p>
          </div>
        </button>
      `).join("");
    }

    function toggleLaser() {
      laserEnabled = !laserEnabled;
      const dot = document.getElementById("laser-dot");
      const btn = document.getElementById("btn-laser");
      dot.style.display = laserEnabled ? "block" : "none";
      if (laserEnabled) {
        btn.classList.add("bg-emerald-600", "text-white");
      } else {
        btn.classList.remove("bg-emerald-600", "text-white");
      }
    }

    window.addEventListener("mousemove", (e) => {
      if (laserEnabled) {
        const dot = document.getElementById("laser-dot");
        dot.style.left = `${e.clientX}px`;
        dot.style.top = `${e.clientY}px`;
      }
    });

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    // Keyboard Shortcuts
    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") {
        e.preventDefault();
        nextSlide();
      } else if (e.key === "ArrowLeft" || e.key === "PageUp") {
        e.preventDefault();
        prevSlide();
      } else if (e.key === "Home") {
        goToSlide(0);
      } else if (e.key === "End") {
        goToSlide(slidesData.length - 1);
      } else if (e.key.toLowerCase() === "g") {
        toggleDrawer();
      } else if (e.key.toLowerCase() === "l") {
        toggleLaser();
      } else if (e.key.toLowerCase() === "f") {
        toggleFullScreen();
      } else if (e.key === "Escape") {
        const drawer = document.getElementById("slide-drawer");
        if (!drawer.classList.contains("hidden")) toggleDrawer();
      }
    });

    /* ==========================================================================
       RESPONSIVE 16:9 VIEWPORT AUTO-SCALER
       ========================================================================== */
    function fitSlideViewport() {
      const viewport = document.getElementById("slide-deck-viewport");
      const availableW = window.innerWidth - 36;
      const availableH = window.innerHeight - 84;
      const scale = Math.min(availableW / 1280, availableH / 720, 1.15);
      viewport.style.transform = `scale(${scale})`;
    }

    window.addEventListener("resize", fitSlideViewport);

    /* ==========================================================================
       FUTURISTIC BIO-PARTICLES CANVAS ANIMATION
       ========================================================================== */
    function initBioParticles() {
      const canvas = document.getElementById("bio-particles");
      const ctx = canvas.getContext("2d");
      canvas.width = 1280;
      canvas.height = 720;

      const particles = Array.from({ length: 28 }, (_, i) => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 4 + 2,
        vx: (Math.random() - 0.5) * 0.45,
        vy: (Math.random() - 0.5) * 0.45,
        color: i % 3 === 0 ? "rgba(253, 185, 19, 0.22)" : "rgba(0, 176, 80, 0.16)"
      }));

      function animateParticles() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
          if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.fill();

          // Subtle molecular links
          for (let j = i + 1; j < particles.length; j++) {
            const p2 = particles[j];
            const dist = Math.hypot(p.x - p2.x, p.y - p2.y);
            if (dist < 130) {
              ctx.beginPath();
              ctx.moveTo(p.x, p.y);
              ctx.lineTo(p2.x, p2.y);
              ctx.strokeStyle = `rgba(52, 103, 57, ${0.07 * (1 - dist / 130)})`;
              ctx.lineWidth = 1;
              ctx.stroke();
            }
          }
        }
        requestAnimationFrame(animateParticles);
      }
      animateParticles();
    }

    window.onload = function () {
      fitSlideViewport();
      initBioParticles();
      renderSlide(0);
    };
  </script>
